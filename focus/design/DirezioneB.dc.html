<!-- Direzione B — Carta stampata: nessuna scheda, solo filetti e tipografia. -->
<div style="width: 390px; height: 844px; background: #F7F1E4; color: #2A2118; position: relative; overflow: hidden;">

          <g transform="translate(206 84) scale(0.44)">

      <figcaption style="font-size: 13px; color: #6E6152; margin: 7px 0 0; display: flex; justify-content: space-between;">

    <div style="border-top: 1px solid #2A2118; margin: 20px 0 0; padding-top: 14px; text-align: center;">
      <p style="font-family: 'Instrument Serif', Georgia, serif; font-size: 96px; line-height: .84; letter-spacing: -.02em; margin: 0; font-variant-numeric: tabular-nums;">21:00</p>
      <p style="font-size: 14.5px; color: #6E6152; margin: 14px 0 0; letter-spacing: .02em;">Concentrazione, venticinque minuti</p>
    </div>

    <div style="display: flex; justify-content: center; gap: 8px; margin: 18px 0 0;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #2A2118;"></span>
      <span style="width: 7px; height: 7px; border-radius: 50%; border: 1px solid #2A2118;"></span>
      <span style="width: 7px; height: 7px; border-radius: 50%; border: 1px solid #2A2118;"></span>
      <span style="width: 7px; height: 7px; border-radius: 50%; border: 1px solid #2A2118;"></span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 26px 0 0;">
      <button style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; background: #2A2118; color: #F7F1E4; border: 0; padding: 13px 0; width: 100%;">Metti in pausa</button>
      <div style="display: flex; gap: 22px; font-size: 14.5px; color: #6E6152;">
        <span style="border-bottom: 1px solid #C6B69C;">Salta</span>
        <span style="border-bottom: 1px solid #C6B69C;">Azzera</span>

    <div style="border-top: 1px solid #C6B69C; margin: 24px 0 0; padding-top: 12px; display: flex; justify-content: space-between; font-size: 13.5px; color: #6E6152;">
      <span>Oggi</span><span>4 h 10 · 7 giorni di fila</span>
    </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; border-top: 1px solid #2A2118; background: #F7F1E4;">
    <div style="flex: 1; text-align: center; padding: 13px 0 15px; font-family: 'Instrument Serif', Georgia, serif; font-size: 16px; border-right: 1px solid #C6B69C; background: #2A2118; color: #F7F1E4;">Timer</div>
    <div style="flex: 1; text-align: center; padding: 13px 0 15px; font-family: 'Instrument Serif', Georgia, serif; font-size: 16px; border-right: 1px solid #C6B69C;">Casa</div>
    <div style="flex: 1; text-align: center; padding: 13px 0 15px; font-family: 'Instrument Serif', Georgia, serif; font-size: 16px; border-right: 1px solid #C6B69C;">Numeri</div>
    <div style="flex: 1; text-align: center; padding: 13px 0 15px; font-family: 'Instrument Serif', Georgia, serif; font-size: 16px;">Impost.</div>
